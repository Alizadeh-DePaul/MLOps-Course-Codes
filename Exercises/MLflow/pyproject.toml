[project]
name = "mlflow-exercise"
version = "0.2.0"
description = "Starter package for the SE 489 MLflow experiment-tracking exercise."
requires-python = ">=3.11,<3.12"
dependencies = [
    "mlflow>=3.12,<4",
    "scikit-learn>=1.8",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "optuna>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This package has no importable Python modules at the top level — the .py
# files are scripts students run directly. The metadata-only project is here
# so `pip install -e .` (or `uv pip install -e .`) gives a clean way to pin
# the dependency set.
py-modules = []

[project]
name = "api-and-requests"
version = "0.1.0"
description = "HTTP, requests, and curl exercise for SE 489 MLOps."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.34,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.0",
    "types-requests>=2.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "step1_status_codes",
    "step2_payloads",
    "step3_binary_download",
    "step4_post_form_vs_json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

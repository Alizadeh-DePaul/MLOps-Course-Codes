[project]
name = "performance-profiling"
version = "0.1.0"
description = "Starter code for the SE 489 Python and ML Code Performance Profiling exercise"
requires-python = ">=3.11,<3.12"

# Base deps shared by every install. torch is intentionally NOT here — it's
# in the cpu/cuda extras below because the wheel comes from different indexes.
dependencies = [
    "torchvision>=0.17",
    "numpy>=1.26",
    "snakeviz>=2.2",         # cProfile visualizer
    # torch.profiler ships inside torch itself; nothing extra to install for it.
]

# ---------------------------------------------------------------------------
# Optional dependencies (extras).
#
# Pick exactly ONE of cpu / cuda when installing. They are mutually
# exclusive — see the [tool.uv] conflicts block at the bottom.
#
#   uv sync --extra cpu              CPU-only / Apple Silicon
#   uv sync --extra cuda             Windows or Linux with NVIDIA GPU
#   uv sync --extra cuda --extra dev # add the dev tools too
#   uv sync --extra cpu --extra viz  # also install the TensorBoard viewer
# ---------------------------------------------------------------------------
[project.optional-dependencies]
cpu = ["torch>=2.2"]
cuda = ["torch>=2.2"]

# Visualization extra — TensorBoard + the PyTorch profiler plugin.
# We keep this opt-in because:
#   1. The plugin is in maintenance mode (last release 0.4.3, Apr 2023)
#      and PyTorch upstream has marked TensorBoard plugin support deprecated.
#   2. Some `uv sync` runs hit a known build-isolation bug installing
#      torch-tb-profiler 0.4.3 (astral-sh/uv#16651). If that happens,
#      run: `uv pip install torch-tb-profiler --no-build-isolation`
#   3. Students who can't get the plugin to install can still complete
#      the exercise via the Perfetto UI fallback documented in README.md.
viz = [
    "tensorboard>=2.16",
    "torch-tb-profiler>=0.4.3",
]

dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter. Keep light here so students focus on profiling,
# not on lint errors in teaching-grade scripts.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# uv: route `torch` to the right wheel index based on which extra is active.
# torchvision and numpy come from the default PyPI index — no override needed.
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu",   extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

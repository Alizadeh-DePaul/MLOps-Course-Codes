# Vertex AI CustomJob spec (CPU).
#
# Submit with:
#   gcloud ai custom-jobs create \
#       --region=us-central1 \
#       --display-name=mlops489-train \
#       --config=config_cpu.yaml
#
# The single placeholder is <project-id>. The demo runners substitute this
# automatically into a temp copy of the file; for manual submission, replace
# it with `sed` or your editor.

workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: us-central1-docker.pkg.dev/<project-id>/mlops489-docker/digits-trainer:v1
      # Override train.py CLI args here. Empty list = use script defaults.
      args:
        - --epochs=20
        - --batch-size=64
        - --lr=0.01

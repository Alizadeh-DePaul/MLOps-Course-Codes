## W&B Sweep configuration for the SE 489 Week 7 WandB exercise.
##
## Usage (from inside Exercises/WandB/, after `wandb login`):
##   wandb sweep sweep.yaml          # registers the sweep, prints a sweep ID
##   wandb agent <sweep-id>          # starts a worker that picks values and runs train.py
##
## Notes:
##   * `program` is a path RELATIVE to the working directory you invoke
##     `wandb agent` from. Keep it `train.py` and run from this folder.
##   * `method: bayes` requires a `metric` block; `random` and `grid` do not.
##   * The training loop must call `wandb.log({"loss": ...})` for the metric
##     name below to be visible to the sweep optimizer.
program: train.py
project: Week7-project   # land sweep runs in the same dashboard as your direct `python train.py` runs

# Force the agent's subprocess to use the SAME Python interpreter that's running
# the agent itself (i.e. your venv's python.exe), instead of whatever `python`
# resolves to on PATH. Without this, on Windows machines with anaconda installed,
# the subprocess often picks up anaconda's python instead of the venv's, and you
# get `AttributeError: module 'wandb' has no attribute 'init'` because anaconda
# doesn't have wandb properly installed.
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}

method: bayes
metric:
  name: loss
  goal: minimize
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1
  batch_size:
    values: [16, 32, 64, 128]
  dropout:
    min: 0.1
    max: 0.5

[project]
name = "gcp-artifact-registry-exercise"
version = "0.1.0"
description = "scikit-learn digits classifier wrapped in a container image for the SE 489 Artifact Registry exercise"
requires-python = ">=3.11,<3.12"
dependencies = [
    "scikit-learn>=1.5,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

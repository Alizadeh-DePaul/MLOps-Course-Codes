[project]
name = "gcp-cloud-run-exercise"
version = "0.1.0"
description = "Basic FastAPI app containerized and deployed to Cloud Run for the SE 489 Deployment exercise"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["basic_fastapi"]

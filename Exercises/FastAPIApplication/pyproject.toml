[project]
name = "fastapi-application"
version = "1.0.0"
description = "Complete FastAPI reference application for SE 489 MLOps."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.0",
    "httpx>=0.27",          # required by fastapi.testclient
]
# Heavy ML deps for the OPTIONAL image-captioning app (app/ml_caption.py).
ml = [
    "torch>=2.4,<3",
    "transformers>=4.44",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

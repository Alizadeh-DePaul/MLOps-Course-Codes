# Hydra config for logging_hydra.py.
#
# The `defaults` list does two things:
#   1. `_self_`  - process this file's own keys (the `model:` block below)
#                  in the composition order.
#   2. `override hydra/job_logging: custom_logging` - REPLACE Hydra's
#      default job_logging config with the contents of
#      conf/hydra/job_logging/custom_logging.yaml.
#
# We use the override pattern (not inline `hydra: job_logging: ...`)
# because Hydra deep-merges inline overrides with its built-in default,
# which leaves `handlers.console.stream: ext://sys.stdout` in place and
# causes the dictConfig step to fail with:
#     TypeError: RichHandler.__init__() got an unexpected keyword
#                argument 'stream'
# See the comment at the top of conf/hydra/job_logging/custom_logging.yaml
# for the full story.

defaults:
  - _self_
  - override hydra/job_logging: custom_logging

# Pretend ML config so `cfg.model` resolves to something meaningful.
# Try overriding from the CLI:
#   python logging_hydra.py model.lr=1e-3 model.batch_size=64
model:
  name: simple_cnn
  lr: 0.0001
  batch_size: 32
  epochs: 10

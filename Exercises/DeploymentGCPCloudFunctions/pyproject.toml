[project]
name = "gcp-cloud-functions-exercise"
version = "0.1.0"
description = "Hello-world and KNN HTTP functions deployed to Cloud Run functions (formerly Cloud Functions) for the SE 489 Deployment exercise"
requires-python = ">=3.11,<3.12"
dependencies = [
    "functions-framework>=3.8,<4",
    "google-cloud-storage>=2.18,<4",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["train_model"]

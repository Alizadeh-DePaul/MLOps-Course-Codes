name: "Run MLOps tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-unit-testing:
    name: "PythonUnitTesting exercise"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Exercises/PythonUnitTesting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync exercise venv (CPU torch)
        run: uv sync --extra cpu

      - name: Run pytest
        run: uv run pytest -v

      - name: Run pytest with coverage
        run: |
          uv run pytest \
            --cov=models --cov=training \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: Exercises/PythonUnitTesting/coverage.xml
          fail_ci_if_error: false
